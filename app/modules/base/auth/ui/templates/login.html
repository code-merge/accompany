<h2 class="text-2xl font-semibold text-center mb-4">{{ _('login_heading') }}</h2>

<form
  id="login-form"
  hx-post="/auth/login"
  hx-target="#auth-shell"
  hx-swap="innerHTML"
  class="space-y-4"
>
  <div>
    <label for="email" class="block text-sm font-medium">{{ _('email_label') }}</label>
    <input id="email" name="email" type="email" required
      class="mt-1 w-full p-2 border rounded focus:ring focus:ring-blue-200"
      placeholder="{{ _('email_placeholder') }}"
    />
  </div>
  <div>
    <label for="password" class="block text-sm font-medium">{{ _('password_label') }}</label>
    <input id="password" name="password" type="password" required
      class="mt-1 w-full p-2 border rounded focus:ring focus:ring-blue-200"
      placeholder="{{ _('password_placeholder') }}"
    />
  </div>
  <button type="submit" class="w-full py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
    {{ _("login_btn") }}
  </button>
  {% if error %}
    <p class="text-red-500 text-sm text-center mt-2">{{ _(error) }}</p>
  {% endif %}
</form>
